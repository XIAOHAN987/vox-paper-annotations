<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频动效生产超级工作台 (Super Workbench)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: #07090d; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  
  /* 顶部全局模板总线导航 */
  #top-bar {
    height: 48px; background: #0c0f17; border-bottom: 1px solid #1e293b;
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 50;
  }
  .brand-title {
    font-size: 14px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.5px;
  }
  .brand-badge {
    font-size: 10px; background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 700;
  }
  .template-tabs {
    display: flex; gap: 4px; background: #07090d; padding: 3px; border-radius: 6px; border: 1px solid #1e293b;
  }
  .tab-btn {
    background: transparent; border: none; color: #94a3b8; padding: 5px 12px; font-size: 12px;
    font-weight: 600; border-radius: 4px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .tab-btn:hover:not(.disabled) { color: #f8fafc; background: rgba(255,255,255,0.05); }
  .tab-btn.active { background: #0284c7; color: #fff; }
  .tab-btn.disabled { opacity: 0.4; cursor: not-allowed; font-size: 11px; }

  /* 主工作区 */
  #main-layout { display: flex; flex: 1; height: calc(100vh - 48px); overflow: hidden; }

  #stage {
    flex: 1; height: 100%; overflow-y: auto; overflow-x: auto; position: relative;
    background: #090a0f; padding: 40px 20px; text-align: center;
    border-right: 1px solid #1e293b; user-select: none;
  }
  #canvas-wrap {
    position: relative; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    margin: 0 auto; text-align: left;
  }
  #canvas-wrap img { display: block; max-width: none; pointer-events: none; }
  
  /* 标注图形 */
  .box {
    position: absolute; border: 2px dashed #38bdf8; background: rgba(56, 189, 248, 0.15);
    pointer-events: none; z-index: 10;
  }
  .box.circle { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); border-radius: 999px; }
  .box.highlight { border-color: #fde047; background: rgba(253, 224, 71, 0.35); }
  .box.underline { border-color: #f87171; background: transparent; border-bottom: 3px solid #f87171; }
  .box.wavy { border-color: #fb7185; background: transparent; border-bottom: 3px dashed #fb7185; }
  .box.arrow { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
  .box.cross { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); }
  .box.box-tool { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
  .box.focus { border-color: #c084fc; background: rgba(192, 132, 252, 0.2); }

  /* CAD 引线标注元素 */
  .tech-pin {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    transform: translate(-50%, -50%); border: 2px solid #38bdf8; background: #0c4a6e;
    box-shadow: 0 0 10px #38bdf8; z-index: 15; pointer-events: none;
  }
  .tech-card-marker {
    position: absolute; width: 220px; background: rgba(15, 23, 42, 0.9);
    border: 1px solid #38bdf8; border-radius: 4px; padding: 6px 10px; font-size: 11px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8); z-index: 15; pointer-events: none;
  }

  .badge {
    position: absolute; top: -18px; left: 0; font-size: 11px;
    background: #0284c7; color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: bold;
    white-space: nowrap; pointer-events: none;
  }
  
  #panel {
    width: 380px; height: 100%; background: #11141c; display: flex; flex-direction: column;
    border-left: 1px solid #1e293b; z-index: 20;
  }
  header { padding: 14px 16px; border-bottom: 1px solid #1e293b; }
  .btn-primary {
    background: #2563eb; color: #fff; border: none; padding: 7px 12px; border-radius: 5px;
    font-size: 12px; cursor: pointer; font-weight: 500; transition: background 0.15s;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-upload {
    width: 100%; padding: 8px 12px; background: #0f766e; color: #fff; border: 1px dashed #2dd4bf;
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
    margin-bottom: 8px; transition: all 0.2s;
  }
  .btn-upload:hover { background: #115e59; border-color: #5eead4; }

  #type-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px 16px; border-bottom: 1px solid #1e293b; background: #0b0e14;
  }
  #type-row button {
    padding: 6px 0; background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
    border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; transition: all 0.15s;
  }
  #type-row button.active {
    background: #0284c7; color: #fff; border-color: #38bdf8;
  }

  #list { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .ann-item {
    background: #181d28; border: 1px solid #283347; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px; font-size: 12px;
  }
  .ann-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ann-type { font-weight: 700; color: #38bdf8; }
  .ann-del { background: transparent; border: none; color: #ef4444; cursor: pointer; font-weight: bold; font-size: 12px; }
  .ann-del:hover { color: #f87171; }
  
  #actions { padding: 12px 14px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; background: #0c0f17; }
  .row { display: flex; gap: 8px; }
  .row button {
    flex: 1; padding: 8px; border: none; border-radius: 5px; font-size: 12px;
    font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  .row button:hover { opacity: 0.9; }
  #btn-save-project { background: #16a34a; color: #fff; font-size: 13px; font-weight: 700; }
  #btn-preview { background: #0284c7; color: #fff; }
  #btn-copy { background: #334155; color: #f1f5f9; border: 1px solid #475569 !important; }
  #btn-download { background: #334155; color: #f1f5f9; border: 1px solid #475569 !important; }
  
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #10b981; color: #fff; padding: 9px 20px; border-radius: 6px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 100; font-weight: 500;
  }
  #hint { padding: 8px 14px; font-size: 11px; color: #64748b; border-top: 1px solid #1e293b; line-height: 1.4; }

  /* 实时动效播放器 Modal */
  #modal-preview {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column;
  }
  #player-box {
    width: 960px; height: 540px; background: #000; position: relative; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9); border: 1px solid #334155; border-radius: 8px;
  }
  #player-controls {
    width: 960px; display: flex; align-items: center; gap: 12px; margin-top: 12px;
    background: #11141c; padding: 10px 16px; border-radius: 8px; border: 1px solid #1e293b;
  }
  #player-controls button {
    background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 4px;
    cursor: pointer; font-weight: 600; font-size: 12px;
  }
  #player-seek { flex: 1; accent-color: #38bdf8; cursor: pointer; }
</style>
</head>
<body>

  <!-- 1. 顶部模板切换总线 -->
  <div id="top-bar">
    <div class="brand-title">
      <span>动效生产超级工作台</span>
      <span class="brand-badge">PRO V2.0</span>
    </div>

    <div class="template-tabs">
      <button class="tab-btn active" data-tab="vox">1. VOX 纸张标注</button>
      <button class="tab-btn" data-tab="tech">2. CAD 科技引线</button>
      <button class="tab-btn disabled" title="正在开发中">3. 决策标尺 (SOON)</button>
      <button class="tab-btn disabled" title="正在开发中">4. 全屏文字击打 (SOON)</button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;">
      <a id="btn-top-studio" href="/studio/" target="_blank" style="background:#7c3aed;color:#fff;text-decoration:none;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background .15s;">
        <span>▶ 打开 Remotion 电影级播放器 (全功能)</span>
      </a>
      <span style="font-size:11px;color:#64748b;">Remotion 60FPS 内核</span>
    </div>
  </div>

  <!-- 2. 主工作区 -->
  <div id="main-layout">
    <div id="stage">
      <div id="canvas-wrap">
        <div id="drop-hint" style="padding: 40px; text-align: center; color: #64748b;">
          <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #94a3b8;">拖拽图片到此，或在右侧点击上传</div>
          <div style="font-size: 12px;">支持 PNG / JPG / WebP / SVG 高清截图与架构图</div>
        </div>
      </div>
    </div>

    <div id="panel">
      <header>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <h1 id="panel-title" style="margin:0;font-size:14px;color:#f8fafc;">VOX 纸张手绘标注</h1>
          <span id="panel-mode-badge" style="font-size:10px;color:#38bdf8;background:#0c4a6e;padding:2px 6px;border-radius:4px;">手绘纸张模式</span>
        </div>

        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <button class="btn-upload" id="btn-upload-file">上传本地图片 (或拖入左侧)</button>

        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input id="img-path" list="known-images" placeholder="或输入路径/URL" style="flex:1;background:#0f172a;border:1px solid #334155;color:#f8fafc;padding:5px 8px;border-radius:4px;font-size:12px;">
          <datalist id="known-images">
            <option value="screenshots/tech-chip.svg"></option>
            <option value="screenshots/hockey-page.png"></option>
            <option value="textures/newspaper.jpg"></option>
          </datalist>
          <button class="btn-primary" id="btn-load">加载</button>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-size:11px;color:#94a3b8;">底色模式:</span>
          <select id="theme-select" style="flex:1;background:#0f172a;color:#f8fafc;border:1px solid #334155;padding:4px 6px;border-radius:4px;font-size:11px;outline:none;">
            <option value="light">浅色纸张 / 白底报纸 (Light)</option>
            <option value="dark" selected>暗黑模式 / 纯黑推特 (Dark)</option>
          </select>
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;color:#94a3b8;">背景质感:</span>
          <select id="bg-select" style="flex:1;background:#0f172a;color:#f8fafc;border:1px solid #334155;padding:4px 6px;border-radius:4px;font-size:11px;outline:none;cursor:pointer;">
            <option value="grid" selected>科技工业微网格 (Dark Tech Grid)</option>
            <option value="blueprint">深蓝工程蓝图 (Blueprint)</option>
            <option value="noise">胶片杂色噪点 (Film Grain Noise)</option>
            <option value="paper">复古报纸底纹 (Vintage Paper)</option>
            <option value="vignette">电影暗角微光 (Radial Glow)</option>
            <option value="pure">极简纯黑 (Pure Minimal)</option>
          </select>
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;color:#94a3b8;">节奏预设:</span>
          <select id="pace-select" style="flex:1;background:#0f172a;color:#38bdf8;border:1px solid #334155;padding:4px 6px;border-radius:4px;font-size:11px;font-weight:600;outline:none;cursor:pointer;">
            <option value="35">紧凑短视频 (35帧 / 1.1s)</option>
            <option value="50" selected>标准从容 (50帧 / 1.6s)</option>
            <option value="80">慢速口播 (80帧 / 2.6s)</option>
          </select>
        </div>
      </header>

      <!-- 纸张工具选择行 -->
      <div id="type-row">
        <button data-t="circle" class="active">圆圈</button>
        <button data-t="highlight">高亮</button>
        <button data-t="underline">下划线</button>
        <button data-t="wavy">波浪线</button>
        <button data-t="arrow">箭头</button>
        <button data-t="cross">打叉</button>
        <button data-t="box-tool">方框</button>
        <button data-t="focus">聚焦</button>
      </div>

      <!-- 科技引线工具提示 -->
      <div id="tech-tools-row" style="display:none;padding:10px 16px;background:#0b0e14;border-bottom:1px solid #1e293b;">
        <button id="btn-add-callout" style="width:100%;padding:7px;background:#0284c7;color:#fff;border:none;border-radius:4px;font-weight:700;font-size:12px;cursor:pointer;">+ 新增 CAD 科技引线锚点</button>
      </div>

      <div id="list"></div>

      <div id="actions">
        <div class="row">
          <button id="btn-save-project">保存到项目 (直接生效)</button>
          <button id="btn-preview">▶ 实时预览 (60fps)</button>
        </div>
        <div class="row">
          <button id="btn-copy">复制 JSON 数据</button>
          <button id="btn-download">下载 .json 文件</button>
        </div>
      </div>

      <div id="hint">在图上拖框即标注 · 点击「实时预览」可在网页模拟相机运镜与手绘生长</div>
    </div>
  </div>

  <!-- 实时动效播放器 Modal -->
  <div id="modal-preview">
    <div id="player-box">
      <canvas id="preview-canvas" width="1920" height="1080" style="width:100%;height:100%;display:block;"></canvas>
    </div>
    <div id="player-controls">
      <button id="btn-play-pause">暂停</button>
      <button id="btn-restart">重播</button>
      <select id="speed-select" style="background:#0f172a;color:#f8fafc;border:1px solid #334155;padding:4px 8px;border-radius:4px;font-size:12px;outline:none;cursor:pointer;">
        <option value="0.5">0.5x 极慢</option>
        <option value="0.75">0.75x 慢速</option>
        <option value="1.0" selected>1.0x 电影原速 (30fps)</option>
        <option value="1.25">1.25x 快速</option>
        <option value="1.5">1.5x 倍速</option>
      </select>
      <input type="range" id="player-seek" min="0" max="300" value="0">
      <span id="player-time" style="font-size:12px;color:#94a3b8;font-family:monospace;">00:00 / 00:10</span>
      <button id="btn-close-modal" style="background:#dc2626;">关闭预览</button>
    </div>
  </div>

  <div id="toast">已复制</div>

<script>
let currentTab = 'vox'; // 'vox' | 'tech'
let imgW = 0, imgH = 0, viewScale = 1, curType = 'circle', curTheme = 'dark', curBgType = 'grid', anns = [], techCallouts = [], drawing = null, idSeq = 1;
let currentImgElement = null;
let uploadedDataUrl = '';
let uploadedFileName = 'custom-image.png';

const wrap = document.getElementById('canvas-wrap');
const LIGHT_COLORS = {
  circle: '#3b82f6', highlight: '#eab308', underline: '#ef4444', wavy: '#f43f5e',
  arrow: '#2563eb', cross: '#dc2626', 'box-tool': '#0284c7', focus: '#a855f7'
};
const DARK_COLORS = {
  circle: '#60a5fa', highlight: '#fde047', underline: '#f87171', wavy: '#fb7185',
  arrow: '#38bdf8', cross: '#ef4444', 'box-tool': '#38bdf8', focus: '#c084fc'
};
let COLORS = DARK_COLORS;

// 模板切换
document.querySelectorAll('.tab-btn:not(.disabled)').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    
    if (currentTab === 'vox') {
      document.getElementById('panel-title').textContent = 'VOX 纸张手绘标注';
      document.getElementById('panel-mode-badge').textContent = '手绘纸张模式';
      document.getElementById('type-row').style.display = 'grid';
      document.getElementById('tech-tools-row').style.display = 'none';
      if (!uploadedDataUrl) loadImgFromSrc('screenshots/hockey-page.png');
      renderBoxes();
      renderList();
    } else if (currentTab === 'tech') {
      document.getElementById('panel-title').textContent = 'CAD 暗调科技引线';
      document.getElementById('panel-mode-badge').textContent = 'CAD HUD 拆解模式';
      document.getElementById('type-row').style.display = 'none';
      document.getElementById('tech-tools-row').style.display = 'block';
      if (!uploadedDataUrl) loadImgFromSrc('screenshots/tech-chip.svg');
      loadDefaultTechCallouts();
      renderTechCallouts();
    }
  };
});

function loadDefaultTechCallouts() {
  if (techCallouts.length === 0) {
    techCallouts = [
      {
        id: 1, at: 20, target: [850, 440], cardPos: [520, 220],
        tag: 'COMPUTE DIE', title: 'TENSOR CORE 01 (NPU)', colorTheme: 'cyan',
        metrics: [
          { label: 'FP16 COMPUTE', value: '3.8 PFLOPS' },
          { label: 'SRAM CACHE', value: '64 MB' },
          { label: 'LATENCY', value: '0.24 ms' }
        ]
      },
      {
        id: 2, at: 90, target: [490, 540], cardPos: [180, 480],
        tag: 'MEMORY BUS', title: 'HBM3E STACK (32GB)', colorTheme: 'amber',
        metrics: [
          { label: 'BANDWIDTH', value: '1.2 TB/s' },
          { label: 'BUS WIDTH', value: '4096-BIT' }
        ]
      }
    ];
  }
}

// 主题切换
document.getElementById('theme-select').onchange = (e) => {
  curTheme = e.target.value;
  COLORS = curTheme === 'dark' ? DARK_COLORS : LIGHT_COLORS;
  renderBoxes();
  renderList();
};

// 背景质感切换
document.getElementById('bg-select').onchange = (e) => {
  curBgType = e.target.value;
  updateStageBackground();
  toast(`背景质感已切换为: ${e.target.options[e.target.selectedIndex].text}`);
};

function updateStageBackground() {
  const stage = document.getElementById('stage');
  if (curBgType === 'grid') {
    stage.style.background = 'radial-gradient(circle at 50% 50%, rgba(20, 26, 41, 0.7) 0%, rgba(7, 9, 13, 0.98) 100%), linear-gradient(to right, rgba(51, 65, 85, 0.28) 1px, transparent 1px), linear-gradient(to bottom, rgba(51, 65, 85, 0.28) 1px, transparent 1px)';
    stage.style.backgroundSize = '100% 100%, 48px 48px, 48px 48px';
  } else if (curBgType === 'blueprint') {
    stage.style.background = 'radial-gradient(circle at 50% 50%, rgba(8, 27, 51, 0.9) 0%, rgba(3, 10, 20, 0.98) 100%), linear-gradient(to right, rgba(56, 189, 248, 0.18) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.18) 1px, transparent 1px)';
    stage.style.backgroundSize = '100% 100%, 32px 32px, 32px 32px';
  } else if (curBgType === 'vignette') {
    stage.style.background = 'radial-gradient(circle at 50% 50%, #1e2536 0%, #06070a 100%)';
  } else if (curBgType === 'paper') {
    stage.style.background = '#f2ece1';
  } else if (curBgType === 'noise') {
    stage.style.background = '#0d0f14';
  } else {
    stage.style.background = '#07090d';
  }
}
updateStageBackground();

const typeBtns = document.querySelectorAll('#type-row button');
typeBtns.forEach(btn => {
  btn.onclick = () => {
    typeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curType = btn.dataset.t;
  };
});

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2000);
}

function loadImgFromSrc(src, fileName = 'custom-image.png') {
  const img = new Image();
  img.onload = () => {
    imgW = img.naturalWidth;
    imgH = img.naturalHeight;
    currentImgElement = img;
    wrap.innerHTML = '';
    wrap.appendChild(img);
    const fit = () => {
      const stageW = document.getElementById('stage').clientWidth - 60;
      viewScale = Math.min(1, stageW / imgW);
      if (viewScale <= 0.1) viewScale = 1;
      img.style.width = (imgW * viewScale) + 'px';
      img.style.height = (imgH * viewScale) + 'px';
      if (currentTab === 'vox') renderBoxes();
      else renderTechCallouts();
    };
    fit();
    window.onresize = fit;
    toast(`已载入图片: ${imgW}×${imgH}`);
  };
  img.src = src;
}

// 本地文件上传
const fileInput = document.getElementById('file-input');
document.getElementById('btn-upload-file').onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    uploadedDataUrl = evt.target.result;
    uploadedFileName = file.name;
    loadImgFromSrc(uploadedDataUrl, file.name);
  };
  reader.readAsDataURL(file);
};

// 拖拽上传
const stageEl = document.getElementById('stage');
stageEl.ondragover = (e) => { e.preventDefault(); stageEl.style.background = '#0f172a'; };
stageEl.ondragleave = () => updateStageBackground();
stageEl.ondrop = (e) => {

wrap.onmousedown = (e) => {
  if (e.target !== wrap && e.target !== wrap.querySelector('img')) return;
  if (!imgW) return;
  
  if (currentTab === 'tech') {
    // 科技引线模式：点击添加新引线
    const r = wrap.getBoundingClientRect();
    const clickX = Math.round((e.clientX - r.left) / viewScale);
    const clickY = Math.round((e.clientY - r.top) / viewScale);
    
    const newCallout = {
      id: ++idSeq,
      at: techCallouts.length ? Math.max(...techCallouts.map(c => c.at)) + 45 : 20,
      target: [clickX, clickY],
      cardPos: [Math.max(20, clickX - 120), Math.max(20, clickY - 140)],
      tag: 'HARDWARE',
      title: 'MODULE_' + idSeq,
      colorTheme: 'cyan',
      metrics: [
        { label: 'STATUS', value: 'ACTIVE' },
        { label: 'CLOCK', value: '2.4 GHz' }
      ]
    };
    techCallouts.push(newCallout);
    renderTechCallouts();
    toast('已添加 CAD 科技引线锚点');
    return;
  }

  // 纸张标注模式：拉框
  const r = wrap.getBoundingClientRect();
  const startX = (e.clientX - r.left) / viewScale;
  const startY = (e.clientY - r.top) / viewScale;
  drawing = { startX, startY };

  const tmp = document.createElement('div');
  tmp.className = `box ${curType}`;
  tmp.id = 'tmp-box';
  wrap.appendChild(tmp);

  window.onmousemove = (ev) => {
    if (!drawing) return;
    const curX = (ev.clientX - r.left) / viewScale;
    const curY = (ev.clientY - r.top) / viewScale;
    const x = Math.min(drawing.startX, curX);
    const y = Math.min(drawing.startY, curY);
    const w = Math.abs(curX - drawing.startX);
    const h = Math.abs(curY - drawing.startY);

    tmp.style.left = (x * viewScale) + 'px';
    tmp.style.top = (y * viewScale) + 'px';
    tmp.style.width = (w * viewScale) + 'px';
    tmp.style.height = (h * viewScale) + 'px';
  };

  window.onmouseup = (ev) => {
    if (!drawing) return;
    const curX = (ev.clientX - r.left) / viewScale;
    const curY = (ev.clientY - r.top) / viewScale;
    const x = Math.round(Math.min(drawing.startX, curX));
    const y = Math.round(Math.min(drawing.startY, curY));
    const w = Math.round(Math.abs(curX - drawing.startX));
    const h = Math.round(Math.abs(curY - drawing.startY));

    tmp.remove();
    drawing = null;
    window.onmousemove = null;
    window.onmouseup = null;

    if (w < 10 || h < 10) return;

    const maxAt = anns.length ? Math.max(...anns.map(a => a.at)) : 0;
    const nextAt = anns.length ? maxAt + paceInterval : 20;

    anns.push({
      id: idSeq++,
      action: curType === 'box-tool' ? 'box' : curType,
      at: nextAt,
      target: { x, y, width: w, height: h }
    });

    renderBoxes();
    renderList();
  };
};

let paceInterval = 50;
const paceSelect = document.getElementById('pace-select');
if (paceSelect) {
  paceSelect.onchange = (e) => {
    paceInterval = parseInt(e.target.value) || 50;
    toast(`已切换节奏: 进场间隔 ${paceInterval} 帧 (${(paceInterval/30).toFixed(1)}s)`);
  };
}

function renderBoxes() {
  wrap.querySelectorAll('.box, .badge, .tech-pin, .tech-card-marker').forEach(el => el.remove());
  anns.forEach((a, i) => {
    const el = document.createElement('div');
    const typeClass = a.action === 'box' ? 'box-tool' : a.action;
    el.className = `box ${typeClass}`;
    el.style.left = (a.target.x * viewScale) + 'px';
    el.style.top = (a.target.y * viewScale) + 'px';
    el.style.width = (a.target.width * viewScale) + 'px';
    el.style.height = (a.target.height * viewScale) + 'px';

    const b = document.createElement('div');
    b.className = 'badge';
    b.textContent = `#${i + 1} ${a.action} @${(a.at/30).toFixed(1)}s (${a.at}f)`;
    el.appendChild(b);
    wrap.appendChild(el);
  });
}

function renderTechCallouts() {
  wrap.querySelectorAll('.box, .badge, .tech-pin, .tech-card-marker').forEach(el => el.remove());
  techCallouts.forEach((c, i) => {
    // 瞄准点
    const pin = document.createElement('div');
    pin.className = 'tech-pin';
    pin.style.left = (c.target[0] * viewScale) + 'px';
    pin.style.top = (c.target[1] * viewScale) + 'px';
    wrap.appendChild(pin);

    // 参数卡片标记
    const card = document.createElement('div');
    card.className = 'tech-card-marker';
    card.style.left = (c.cardPos[0] * viewScale) + 'px';
    card.style.top = (c.cardPos[1] * viewScale) + 'px';
    card.innerHTML = `<span style="color:#38bdf8;font-weight:700;">[${c.tag}]</span> ${c.title} @${(c.at/30).toFixed(1)}s`;
    wrap.appendChild(card);
  });
  renderTechList();
}

  if (currentTab === 'tech') return renderTechList();
  const list = document.getElementById('list');
  list.innerHTML = '';
  anns.sort((a, b) => a.at - b.at).forEach((a, i) => {
    const it = document.createElement('div');
    it.className = 'ann-item';
    it.innerHTML = `
      <div class="ann-item-head">
        <span class="ann-type">#${i + 1} [${a.action}]</span>
        <button class="ann-del" onclick="delAnn(${a.id})">✕ 删除</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="color:#94a3b8;font-size:11px;">触发:</span>

        <span style="color:#38bdf8;font-size:11px;font-weight:600;">${(a.at/30).toFixed(1)}s</span>

function renderTechList() {

  techCallouts.sort((a, b) => a.at - b.at).forEach((c, i) => {
    const it = document.createElement('div');

    it.innerHTML = `
      <div class="ann-item-head">
        <span class="ann-type" style="color:#38bdf8;">#${i + 1} [${c.tag}]</span>
        <button class="ann-del" onclick="delTechCallout(${c.id})">✕ 删除</button>

      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="color:#94a3b8;font-size:11px;">触发:</span>
        <input type="number" value="${c.at}" style="width:52px;background:#0f172a;border:1px solid #334155;color:#f8fafc;padding:2px 4px;border-radius:3px;font-size:11px;" onchange="updateTechAt(${c.id}, this.value)">
        <span style="color:#38bdf8;font-size:11px;font-weight:600;">${(c.at/30).toFixed(1)}s</span>
        <span style="color:#94a3b8;font-size:11px;margin-left:auto;">主题:</span>
        <select style="background:#0f172a;border:1px solid #334155;color:#f8fafc;padding:2px 4px;border-radius:3px;font-size:11px;" onchange="updateTechTheme(${c.id}, this.value)">
          <option value="cyan" ${c.colorTheme === 'cyan' ? 'selected' : ''}>赛博青</option>

window.delAnn = (id) => { anns = anns.filter(a => a.id !== id); renderBoxes(); renderList(); };
window.updateAt = (id, val) => { const a = anns.find(x => x.id === id); if (a) a.at = parseInt(val) || 0; renderBoxes(); renderList(); };
window.delTechCallout = (id) => { techCallouts = techCallouts.filter(c => c.id !== id); renderTechCallouts(); };
window.updateTechAt = (id, val) => { const c = techCallouts.find(x => x.id === id); if (c) c.at = parseInt(val) || 0; renderTechCallouts(); };
window.updateTechTitle = (id, val) => { const c = techCallouts.find(x => x.id === id); if (c) c.title = val; renderTechCallouts(); };
window.updateTechTheme = (id, val) => { const c = techCallouts.find(x => x.id === id); if (c) c.colorTheme = val; renderTechCallouts(); };

function buildJSON() {

    return {
      image: uploadedDataUrl || (document.getElementById('img-path').value.trim() || 'screenshots/tech-chip.svg'),

      imageHeight: imgH,

        at, target, cardPos, tag, title, metrics, colorTheme
      }))
    };
  }

  const normal = anns.filter(a => a.action !== 'focus');
  const focus = anns.find(a => a.action === 'focus');
  return {
    image: uploadedDataUrl || (document.getElementById('img-path').value.trim() || 'screenshots/hockey-page.png'),
    imageWidth: imgW,
    imageHeight: imgH,
    grainOpacity: 0.25,
    cameraMode: 'auto',
    theme: curTheme,
    bgType: curBgType,
    annotations: normal.map(({ action, at, target }) => ({ action, at, target })),
    focus: focus ? { at: focus.at, until: focus.at + 70, target: focus.target, dimOpacity: 0.68 } : undefined
  };
}

const saveToProject = async (rel, content) => {
  try {
    const prefix = window.location.pathname.startsWith('/vox') ? '/vox' : '';
    const res = await fetch(`${prefix}/api/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: rel, content: JSON.parse(content) }),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.success) return data;
    }
  } catch (_) {}
  throw new Error('no-api');
};

// -------------------------------------------------------------
let isPlaying = false, animFrameId = null, currentFrame = 0;
const canvas = document.getElementById('preview-canvas');
const ctx = canvas.getContext('2d');
const modal = document.getElementById('modal-preview');
const seek = document.getElementById('player-seek');
const timeEl = document.getElementById('player-time');

document.getElementById('btn-preview').onclick = () => {
  if (!imgW || !currentImgElement) return toast('请先上传或加载图片');
  const maxAt = currentTab === 'tech'
    ? (techCallouts.length ? Math.max(...techCallouts.map(c => c.at)) : 0)
    : (anns.length ? Math.max(...anns.map(a => a.at)) : 0);
  const totalFrames = Math.max(90, maxAt + 35);
  seek.max = totalFrames;
  modal.style.display = 'flex';
  currentFrame = 0;
  isPlaying = true;
  lastTime = performance.now();
  playLoop();
};

document.getElementById('btn-close-modal').onclick = () => {
  modal.style.display = 'none';
  isPlaying = false;
  cancelAnimationFrame(animFrameId);
};

let lastTime = 0;
let playbackSpeed = 1.0;
document.getElementById('speed-select').onchange = (e) => {
  playbackSpeed = parseFloat(e.target.value) || 1.0;
};

function playLoop() {
  if (!isPlaying) return;
  const now = performance.now();
  const delta = (now - lastTime);
  const frameDuration = (1000 / 30) / playbackSpeed;

  if (delta >= frameDuration) {
    const framesToAdvance = Math.floor(delta / frameDuration);
    currentFrame += framesToAdvance;
    lastTime = now - (delta % frameDuration);

    if (currentFrame > parseInt(seek.max)) {
      currentFrame = 0;
    }
    seek.value = currentFrame;
    updateTimeText(currentFrame);
    renderCanvasFrame(currentFrame);
  }

  animFrameId = requestAnimationFrame(playLoop);
}

seek.oninput = (e) => {
  currentFrame = parseInt(e.target.value);
  updateTimeText(currentFrame);
  renderCanvasFrame(currentFrame);
};

function updateTimeText(f) {
  const curS = Math.floor(f / 30);
  const maxS = Math.floor(seek.max / 30);
  timeEl.textContent = `${String(Math.floor(curS/60)).padStart(2,'0')}:${String(curS%60).padStart(2,'0')} / ${String(Math.floor(maxS/60)).padStart(2,'0')}:${String(maxS%60).padStart(2,'0')}`;
}

document.getElementById('btn-play-pause').onclick = () => {
  isPlaying = !isPlaying;
  document.getElementById('btn-play-pause').textContent = isPlaying ? '暂停' : '播放';
  if (isPlaying) { lastTime = performance.now(); playLoop(); }
};

document.getElementById('btn-restart').onclick = () => {
  currentFrame = 0;
  seek.value = 0;
  isPlaying = true;
  document.getElementById('btn-play-pause').textContent = '暂停';
  lastTime = performance.now();
  playLoop();
};

function renderCanvasFrame(frame) {
  ctx.clearRect(0, 0, 1920, 1080);

  // 背景绘制
  if (curBgType === 'grid') {
    const bgGrad = ctx.createRadialGradient(960, 540, 100, 960, 540, 960);
    bgGrad.addColorStop(0, '#141a29');
    bgGrad.addColorStop(1, '#07090d');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1920, 1080);
    ctx.strokeStyle = 'rgba(51, 65, 85, 0.28)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= 1920; x += 48) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
    }
    for (let y = 0; y <= 1080; y += 48) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#07090d';
    ctx.fillRect(0, 0, 1920, 1080);
  }

  if (!currentImgElement) return;

  const scale = 1920 / imgW;
  const docW = 1920, docH = imgH * scale;

  // 相机轨迹
  let targetX = docW / 2, targetY = docH / 2, targetZoom = 1.0;

  if (currentTab === 'tech') {
    const sorted = [...techCallouts].sort((a, b) => a.at - b.at);
    let curActive = sorted[0];
    for (let c of sorted) {
      if (frame >= c.at - 20) curActive = c;
    }
    if (curActive) {
      const midX = (curActive.target[0] + curActive.cardPos[0] + 130) * scale / 2;
      const midY = (curActive.target[1] + curActive.cardPos[1] + 40) * scale / 2;
      const p = Math.min(1, Math.max(0, (frame - (curActive.at - 20)) / 22));
      const smoothP = 1 - Math.pow(1 - p, 3);
      targetX = (docW / 2) * (1 - smoothP) + midX * smoothP;
      targetY = (docH / 2) * (1 - smoothP) + midY * smoothP;
      targetZoom = 0.95 * (1 - smoothP) + 1.25 * smoothP;
    }
  } else {
    const sortedAnns = [...anns].sort((a, b) => a.at - b.at);
    let curTarget = sortedAnns[0];
    for (let a of sortedAnns) {
      if (frame >= a.at - 15) curTarget = a;
    }
    if (curTarget) {
      const tx = (curTarget.target.x + curTarget.target.width / 2) * scale;
      const ty = (curTarget.target.y + curTarget.target.height / 2) * scale;
      const p = Math.min(1, Math.max(0, (frame - (curTarget.at - 15)) / 20));
      const smoothP = 1 - Math.pow(1 - p, 3);
      targetX = (docW / 2) * (1 - smoothP) + tx * smoothP;
      targetY = (docH * 0.35) * (1 - smoothP) + ty * smoothP;
      targetZoom = 1.0 * (1 - smoothP) + 1.45 * smoothP;
    }
  }

  ctx.save();
  ctx.translate(960, 540);
  ctx.scale(targetZoom, targetZoom);
  ctx.translate(-targetX, -targetY);

  ctx.drawImage(currentImgElement, 0, 0, docW, docH);

  // 绘制科技引线
  if (currentTab === 'tech') {
    techCallouts.forEach(c => {
      if (frame < c.at) return;
      const localF = frame - c.at;
      const p = Math.min(1, localF / 20);
      const smoothP = 1 - Math.pow(1 - p, 3);

      const tx = c.target[0] * scale, ty = c.target[1] * scale;
      const cx = c.cardPos[0] * scale, cy = c.cardPos[1] * scale;
      const isRight = cx >= tx;
      const cardW = 240;
      const connectX = isRight ? cx : cx + cardW;
      const connectY = cy + 20;

      const elbowX = tx + (isRight ? Math.abs(connectX - tx) * 0.5 : -Math.abs(connectX - tx) * 0.5);
      const elbowY = ty + (connectY > ty ? Math.abs(connectX - tx) * 0.5 : -Math.abs(connectX - tx) * 0.5);

      const col = c.colorTheme === 'amber' ? '#f59e0b' : (c.colorTheme === 'emerald' ? '#34d399' : '#38bdf8');

      // 瞄准点
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(tx, ty, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      const rPulse = (localF % 25) / 25 * 18 + 6;
      ctx.beginPath(); ctx.arc(tx, ty, rPulse, 0, Math.PI*2); ctx.stroke();

      // 折线
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      if (smoothP <= 0.5) {
        const p1 = smoothP * 2;
        ctx.lineTo(tx + (elbowX - tx) * p1, ty + (elbowY - ty) * p1);
      } else {
        const p2 = (smoothP - 0.5) * 2;
        ctx.lineTo(elbowX, elbowY);
        ctx.lineTo(elbowX + (connectX - elbowX) * p2, elbowY + (connectY - elbowY) * p2);
      }
      ctx.stroke();

      // 卡片
      if (smoothP > 0.4) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = col;
        ctx.lineWidth = 1;
        ctx.fillRect(cx, cy, cardW, 80);
        ctx.strokeRect(cx, cy, cardW, 80);

        ctx.fillStyle = col;
        ctx.font = 'bold 10px monospace';
        ctx.fillText(`[${c.tag || 'CALLOUT'}]`, cx + 10, cy + 18);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(c.title || '', cx + 10, cy + 36);

        if (c.metrics && c.metrics[0]) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '10px monospace';
          ctx.fillText(`${c.metrics[0].label}: ${c.metrics[0].value}`, cx + 10, cy + 58);
        }
      }
    });
  } else {
    // 绘制手绘纸张标注
    anns.forEach(a => {
      if (frame < a.at) return;
      const localF = frame - a.at;
      const dur = 18;
      const progress = Math.min(1, localF / dur);
      const smoothP = 1 - Math.pow(1 - progress, 3);
      const tx = a.target.x * scale, ty = a.target.y * scale;
      const tw = a.target.width * scale, th = a.target.height * scale;
      const col = curTheme === 'dark' ? '#38bdf8' : '#1d4ed8';
      const redCol = curTheme === 'dark' ? '#f87171' : '#dc2626';
      const yelCol = curTheme === 'dark' ? '#fde047' : '#eab308';

      if (a.action === 'circle') {
        ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath();
        const r = Math.min(th / 2 + 10, 24);
        if (tw / Math.max(1, th) > 1.4) {
          ctx.roundRect(tx - 6, ty - 6, tw + 12, th + 12, r);
        } else {
          ctx.ellipse(tx + tw/2, ty + th/2, tw/2 + 10, th/2 + 8, -0.02, 0, Math.PI * 2 * smoothP);
        }
        ctx.stroke();
      } else if (a.action === 'highlight') {
        ctx.fillStyle = yelCol; ctx.globalAlpha = 0.55;
        ctx.fillRect(tx, ty, tw * smoothP, th);
        ctx.globalAlpha = 1.0;
      } else if (a.action === 'underline') {
        ctx.strokeStyle = redCol; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tx, ty + th + 4);
        ctx.lineTo(tx + tw * smoothP, ty + th + 4);
        ctx.stroke();
      } else if (a.action === 'cross') {
        ctx.strokeStyle = redCol; ctx.lineWidth = 6; ctx.lineCap = 'round';
        const p1 = Math.min(1, smoothP * 1.7);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + tw * p1, ty + th * p1);
        ctx.stroke();
        if (smoothP > 0.3) {
          const p2 = Math.min(1, (smoothP - 0.3) * 1.43);
          ctx.beginPath();
          ctx.moveTo(tx + tw, ty);
          ctx.lineTo(tx + tw - tw * p2, ty + th * p2);
          ctx.stroke();
        }
      } else if (a.action === 'arrow') {
        ctx.strokeStyle = col; ctx.lineWidth = 5.5; ctx.lineCap = 'round'; ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(tx, ty + th / 2);
        ctx.lineTo(tx + tw * smoothP, ty + th / 2);
        ctx.stroke();
        if (smoothP > 0.65) {
          const headP = Math.min(1, (smoothP - 0.65) / 0.35);
          const hx = tx + tw;
          const hy = ty + th / 2;
          ctx.beginPath();
          ctx.moveTo(hx, hy);
          ctx.lineTo(hx - 24 * headP, hy - 14 * headP);
          ctx.lineTo(hx - 24 * headP, hy + 14 * headP);
          ctx.closePath();
          ctx.fill();
        }
      }
    });
  }

  ctx.restore();
}
